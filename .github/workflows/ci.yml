name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Server tests run against a real Postgres (Drizzle migrations + seeded
    # rows + pgvector), so CI provides a pgvector-enabled Postgres service.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swil_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            mcp/package-lock.json

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install server deps
        run: npm --prefix server ci --no-audit --no-fund

      - name: Install client deps
        run: npm --prefix client ci --no-audit --no-fund

      - name: Install mcp deps
        run: npm --prefix mcp ci --no-audit --no-fund

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Typecheck (client)
        run: npm --prefix client run typecheck

      - name: Lint (server)
        run: npm --prefix server run lint

      - name: Lint (client)
        run: npm --prefix client run lint

      - name: Test (server)
        run: npm --prefix server run test:coverage -- --reporter=dot

      - name: Test (client)
        run: npm --prefix client run test:coverage -- --reporter=dot

      - name: Typecheck (mcp)
        run: npm --prefix mcp run typecheck

      - name: Test (mcp)
        run: npm --prefix mcp run test:coverage -- --reporter=dot

      - name: Build server
        run: npm --prefix server run build

      - name: Build client
        run: npm --prefix client run build
        env:
          # Keep build env minimal — no secrets needed at build time.
          VITE_API_BASE: /api/v1

  python:
    name: Python agent runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'agent/uv.lock'

      - name: Install agent deps
        working-directory: agent
        run: uv sync --frozen

      - name: Lint (ruff check)
        working-directory: agent
        run: uv run ruff check .

      - name: Lint (ruff format)
        working-directory: agent
        run: uv run ruff format --check .

      - name: Typecheck (agent)
        working-directory: agent
        run: uv run mypy

      - name: Test (agent)
        working-directory: agent
        # The coverage floor is enforced here rather than in pyproject's addopts,
        # so that running a single test file locally does not fail the gate.
        run: uv run pytest --cov-fail-under=97

# Note: a Docker build job used to run here. Removed 2026-04-27 because
# (a) we don't currently deploy via container, (b) it added ~2-3 min to
# every CI run, and (c) every infra tweak (.npmrc, env vars, etc.) had
# to be replicated into the Dockerfile. The Dockerfile is still in the
# repo for when we do go down a container deploy path; just re-add a job
# similar to:
