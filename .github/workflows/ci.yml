name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Server tests run against a real Postgres (Drizzle migrations + seeded
    # rows + pgvector), so CI provides a pgvector-enabled Postgres service.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swil_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            mcp/package-lock.json

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install server deps
        run: npm --prefix server ci --no-audit --no-fund

      - name: Contract in sync
        run: npm --prefix server run contract:check

      - name: Install client deps
        run: npm --prefix client ci --no-audit --no-fund

      - name: Install mcp deps
        run: npm --prefix mcp ci --no-audit --no-fund

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Typecheck (client)
        run: npm --prefix client run typecheck

      - name: Lint (server)
        run: npm --prefix server run lint

      - name: Lint (client)
        run: npm --prefix client run lint

      - name: Format check (server)
        run: npm --prefix server run format:check

      - name: Format check (client)
        run: npm --prefix client run format:check

      - name: Format check (mcp)
        run: npm --prefix mcp run format:check

      - name: Test (server)
        run: npm --prefix server run test:coverage -- --reporter=dot

      - name: Test (client)
        run: npm --prefix client run test:coverage -- --reporter=dot

      - name: Typecheck (mcp)
        run: npm --prefix mcp run typecheck

      - name: Lint (mcp)
        run: npm --prefix mcp run lint

      - name: Test (mcp)
        run: npm --prefix mcp run test:coverage -- --reporter=dot

      - name: Build server
        run: npm --prefix server run build

      - name: Build client
        run: npm --prefix client run build
        env:
          # Keep build env minimal — no secrets needed at build time.
          VITE_API_BASE: /api/v1

      - name: Build mcp
        run: npm --prefix mcp run build

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      - name: Knip (unused exports and deps)
        run: npm run knip

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Not gated on `typecheck`: it only reads the repo, so running alongside
    # the other jobs shortens the wall clock; a type error fails CI either way.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # ensure-e2e-db.ts creates swil_e2e_pg itself via the /postgres database.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swil_e2e_pg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root deps (Playwright)
        run: npm ci --no-audit --no-fund

      - name: Install server deps
        run: npm --prefix server ci --no-audit --no-fund

      - name: Install client deps
        run: npm --prefix client ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      # Lints the commits this push / PR adds. Skipped when there is no usable
      # base (new branch: all-zero sha; force-push: old sha no longer exists).
      - name: Lint commit range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; skipping commitlint."
            exit 0
          fi
          npx commitlint --from "$BASE" --to HEAD --verbose

  python:
    name: Python agent runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: 'agent/uv.lock'

      # `uv sync --frozen` installs the lock as-is without checking it against
      # pyproject.toml; this fails when the two have drifted (ci-check does the same).
      - name: Lockfile in sync (agent)
        working-directory: agent
        run: uv lock --check

      - name: Install agent deps
        working-directory: agent
        run: uv sync --frozen

      - name: Lint (ruff check)
        working-directory: agent
        run: uv run ruff check .

      - name: Lint (ruff format)
        working-directory: agent
        run: uv run ruff format --check .

      - name: Typecheck (agent)
        working-directory: agent
        run: uv run mypy

      - name: Test (agent)
        working-directory: agent
        # The coverage floor is enforced here rather than in pyproject's addopts,
        # so that running a single test file locally does not fail the gate.
        run: uv run pytest --cov-fail-under=97

# Note: a Docker build job used to run here. Removed 2026-04-27 because
# (a) we don't currently deploy via container, (b) it added ~2-3 min to
# every CI run, and (c) every infra tweak (.npmrc, env vars, etc.) had
# to be replicated into the Dockerfile. The Dockerfile is still in the
# repo for when we do go down a container deploy path; just re-add a job
# similar to:
