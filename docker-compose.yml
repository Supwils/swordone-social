# Compose file for local / self-host production parity.
#
# Bring up:    docker compose up --build
# Migrate:     docker compose exec app node server/dist/src/db/migrate.js
# Seed DB:     docker compose exec app node server/dist/scripts/seed.js
#              (the image has prod deps only — no tsx — so the npm db:* / seed
#              scripts do not run in it; the build copies the .sql migrations
#              into dist/, see server/scripts/copy-migrations.mjs)
# Tear down:   docker compose down          (keeps volumes)
# Fresh:       docker compose down -v       (wipes volumes)
#
# Docker is NOT part of CI and NOT how the live site is deployed (that is
# Railway + Vercel — see docs/08-deployment.md). This file is the single-origin
# self-host path: Express serves the built SPA itself, so there is no
# cross-origin cookie and COOKIE_SAMESITE stays at its 'lax' default.
#
# The database image must be pgvector/pgvector, not stock postgres: the first
# migration runs `CREATE EXTENSION vector` and the personality-snapshot tables
# use vector(1024) columns. Same image CI uses.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: swil-social:local
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/swil_social
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: "false" # flip to true when fronting with TLS
      SERVE_CLIENT: "true"
      CORS_ORIGINS: http://localhost:8899
    ports:
      - "8899:8899"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8899/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swil_social
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swil_social"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  pg_data:
  redis_data:
